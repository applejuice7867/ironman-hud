<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>JARVIS VR HUD - Monocular YouTube & Independent Scaling</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html {
      background-color: #000;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    #start-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 5, 15, 0.98);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 20px;
      overflow-y: auto;
    }
    .btn {
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn:active { background: #00f0ff; color: #000; }
    
    #vr-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
    }
    .viewport {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
    }
    .viewport:first-child {
      border-right: 1px solid rgba(0, 240, 255, 0.2);
    }
    video, #ai-canvas { display: none; }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Monocular YouTube Layer (Only injected into one eye to prevent audio sync and 3D clash) */
    .youtube-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 50vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .youtube-frame-wrapper {
      position: absolute;
      width: 160px;
      height: 95px;
      border: 2px solid rgba(0, 240, 255, 0.8);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      background: rgba(0, 10, 20, 0.85);
      border-radius: 6px;
      overflow: hidden;
      transform-style: preserve-3d;
      transition: transform 0.1s linear;
    }
    .youtube-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .control-group {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: #fff; font-size: 0.8rem; width: 100%; max-width: 300px;
    }
    select, input[type=text] {
      background: #000; color: #00f0ff; border: 1px solid #00f0ff;
      padding: 6px; border-radius: 4px; width: 100%; font-family: monospace;
    }
    .lens-toggle { display: flex; gap: 8px; }
    .lens-btn {
      background: rgba(0, 240, 255, 0.1); border: 1px solid #00f0ff;
      color: #00f0ff; padding: 5px 10px; font-size: 0.8rem;
      border-radius: 4px; cursor: pointer;
    }
    .lens-btn.active { background: #00f0ff; color: #000; font-weight: bold; }
    .slider-row {
      display: flex; justify-content: space-between; width: 100%; font-size: 0.75rem; color: #aaa;
    }
    input[type=range] {
      width: 100%; accent-color: #00f0ff; cursor: pointer;
    }
    .gesture-info {
      color: #00f0ff; font-size: 0.7rem; text-align: center;
      border: 1px dashed rgba(0, 240, 255, 0.4); padding: 6px; border-radius: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose"></script>
</head>
<body>

  <div id="start-overlay">
    <h1 style="color:#00f0ff; text-shadow: 0 0 10px #00f0ff; font-size: 1.3rem; text-align: center;">MARK-LXXXV VR HUD</h1>
    
    <div class="control-group">
      <label for="cam-select">Camera Source:</label>
      <select id="cam-select"><option value="">Initializing...</option></select>
    </div>

    <div class="control-group">
      <label for="yt-input">YouTube ID / URL (Leave blank to hide):</label>
      <input type="text" id="yt-input" placeholder="e.g. dQw4w9WgXcQ or blank">
    </div>

    <div class="control-group">
      <label>Lens Zoom Level:</label>
      <div class="lens-toggle">
        <button class="lens-btn active" data-zoom="0.6">0.6x</button>
        <button class="lens-btn" data-zoom="1.0">1.0x</button>
        <button class="lens-btn" data-zoom="2.0">2.0x</button>
      </div>
    </div>

    <div class="control-group">
      <label>YouTube Eye Display:</label>
      <div class="lens-toggle">
        <button class="lens-btn active" data-eye="left" id="eye-left-btn">Left Eye</button>
        <button class="lens-btn" data-eye="right" id="eye-right-btn">Right Eye</button>
      </div>
    </div>

    <div class="control-group">
      <div class="slider-row"><span>YouTube Player Scale:</span><span id="scale-val">1.0x</span></div>
      <input type="range" id="scale-slider" min="0.4" max="2.0" value="1.0" step="0.1">
    </div>

    <!-- Separate Independent Sliders for HUD FOV and HUD Scale -->
    <div class="control-group">
      <div class="slider-row"><span>HUD Scale Size:</span><span id="hud-scale-val">1.0x</span></div>
      <input type="range" id="hud-scale-slider" min="0.5" max="1.8" value="1.0" step="0.05">
    </div>

    <div class="control-group">
      <div class="slider-row"><span>HUD Field of View (FOV):</span><span id="fov-val">1.0x</span></div>
      <input type="range" id="fov-slider" min="0.7" max="1.5" value="1.0" step="0.05">
    </div>

    <div class="control-group">
      <div class="slider-row"><span>Lens Separation (IPD):</span><span id="ipd-val">0px</span></div>
      <input type="range" id="ipd-slider" min="-60" max="60" value="0" step="1">
    </div>

    <div class="gesture-info">
      🖐️ <b>Open Hand Drag:</b> Move YouTube Box | 👌 <b>Pinch:</b> Play/Pause
    </div>

    <button class="btn" id="start-btn">ENGAGE VR HUD</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="ai-canvas" width="192" height="192"></canvas>

  <div id="vr-container">
    <div class="viewport">
      <canvas id="leftCanvas"></canvas>
      <div class="youtube-layer" id="yt-layer-left" style="display:none;">
        <div class="youtube-frame-wrapper" id="yt-wrapper-left">
          <div id="yt-player-left"></div>
        </div>
      </div>
    </div>
    <div class="viewport">
      <canvas id="rightCanvas"></canvas>
      <div class="youtube-layer" id="yt-layer-right" style="display:none;">
        <div class="youtube-frame-wrapper" id="yt-wrapper-right">
          <div id="yt-player-right"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    const video = document.getElementById('webcam');
    const aiCanvas = document.getElementById('ai-canvas');
    const aiCtx = aiCanvas.getContext('2d', { willReadFrequently: true });
    
    const leftCanvas = document.getElementById('leftCanvas');
    const rightCanvas = document.getElementById('rightCanvas');
    const leftCtx = leftCanvas.getContext('2d');
    const rightCtx = rightCanvas.getContext('2d');
    
    const startBtn = document.getElementById('start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const camSelect = document.getElementById('cam-select');
    const lensBtns = document.querySelectorAll('.lens-btn[data-zoom]');
    const eyeBtns = document.querySelectorAll('.lens-btn[data-eye]');
    const ytInput = document.getElementById('yt-input');
    
    const ipdSlider = document.getElementById('ipd-slider');
    const ipdVal = document.getElementById('ipd-val');
    const fovSlider = document.getElementById('fov-slider');
    const fovVal = document.getElementById('fov-val');
    const hudScaleSlider = document.getElementById('hud-scale-slider');
    const hudScaleVal = document.getElementById('hud-scale-val');
    const scaleSlider = document.getElementById('scale-slider');
    const scaleVal = document.getElementById('scale-val');

    const ytLayerLeft = document.getElementById('yt-layer-left');
    const ytLayerRight = document.getElementById('yt-layer-right');
    const ytWrapperLeft = document.getElementById('yt-wrapper-left');
    const ytWrapperRight = document.getElementById('yt-wrapper-right');

    let ytPlayer = null;
    let hasValidVideo = false;
    let targetYouTubeEye = localStorage.getItem('hud_yt_eye') || 'left';

    eyeBtns.forEach(b => {
      if(b.dataset.eye === targetYouTubeEye) {
        eyeBtns.forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      }
      b.addEventListener('click', (e) => {
        eyeBtns.forEach(x => x.classList.remove('active'));
        e.target.classList.add('active');
        targetYouTubeEye = e.target.dataset.eye;
        localStorage.setItem('hud_yt_eye', targetYouTubeEye);
      });
    });

    function initYouTubePlayer(id) {
      if (!id) return;
      hasValidVideo = true;
      
      // Monocular routing: only display the player in the chosen eye to fix audio sync and double vision
      if (targetYouTubeEye === 'left') {
        ytLayerLeft.style.display = 'flex';
        ytLayerRight.style.display = 'none';
        ytPlayer = new YT.Player('yt-player-left', {
          videoId: id,
          playerVars: { 'autoplay': 1, 'controls': 1, 'playsinline': 1 }
        });
      } else {
        ytLayerLeft.style.display = 'none';
        ytLayerRight.style.display = 'flex';
        ytPlayer = new YT.Player('yt-player-right', {
          videoId: id,
          playerVars: { 'autoplay': 1, 'controls': 1, 'playsinline': 1 }
        });
      }
    }

    let cocoModel = null;
    let handModel = null;
    let predictions = [];
    let handPredictions = [];
    
    let rawOrientation = { pitch: 0, roll: 0, yaw: 0 };
    let orientationOffset = { pitch: 0, roll: 0, yaw: 0 };
    let telemetry = { pitch: 0, roll: 0, yaw: 0, lat: 22.2855, lon: 114.1577, alt: 124.5, speed: 0.0 };
    
    let currentStream = null;
    let currentTrack = null;
    let targetZoom = 0.6;
    let isUserFacing = false;

    let mediaBoxState = { x: 0, y: 0, scale: parseFloat(localStorage.getItem('hud_media_scale') || '1.0') };
    scaleSlider.value = mediaBoxState.scale; scaleVal.innerText = mediaBoxState.scale + 'x';

    scaleSlider.addEventListener('input', (e) => {
      mediaBoxState.scale = parseFloat(e.target.value);
      scaleVal.innerText = mediaBoxState.scale + 'x';
      localStorage.setItem('hud_media_scale', mediaBoxState.scale);
      updateYouTubeDOM3D();
    });

    let userIPD = parseInt(localStorage.getItem('hud_ipd') || '0');
    let userFOV = parseFloat(localStorage.getItem('hud_fov') || '1.0');
    let userHUDScale = parseFloat(localStorage.getItem('hud_scale') || '1.0');

    ipdSlider.value = userIPD; ipdVal.innerText = userIPD + 'px';
    fovSlider.value = userFOV; fovVal.innerText = userFOV + 'x';
    hudScaleSlider.value = userHUDScale; hudScaleVal.innerText = userHUDScale + 'x';

    ipdSlider.addEventListener('input', (e) => {
      userIPD = parseInt(e.target.value);
      ipdVal.innerText = userIPD + 'px';
      localStorage.setItem('hud_ipd', userIPD);
    });

    fovSlider.addEventListener('input', (e) => {
      userFOV = parseFloat(e.target.value);
      fovVal.innerText = userFOV + 'x';
      localStorage.setItem('hud_fov', userFOV);
    });

    hudScaleSlider.addEventListener('input', (e) => {
      userHUDScale = parseFloat(e.target.value);
      hudScaleVal.innerText = userHUDScale + 'x';
      localStorage.setItem('hud_scale', userHUDScale);
    });

    let notificationText = "";
    let notificationTimer = null;
    let gestureCooldown = false;
    let currentTimeText = getCurrentTime();
    let batteryLevel = null;
    let batteryCharging = false;

    function getCurrentTime() {
      return new Date().toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });
    }

    setInterval(() => {
      currentTimeText = getCurrentTime();
    }, 1000);

    async function initDeviceBattery() {
      if (!navigator.getBattery) return;
      try {
        const battery = await navigator.getBattery();
        const updateBattery = () => {
          batteryLevel = Math.round(battery.level * 100);
          batteryCharging = battery.charging;
        };
        updateBattery();
        battery.addEventListener('levelchange', updateBattery);
        battery.addEventListener('chargingchange', updateBattery);
      } catch (e) {}
    }

    initDeviceBattery();

    let mapImage = new Image();
    let mapImageLoaded = false;
    let currentTileUrl = '';

    function goFullscreenAndLock() {
      const docEl = document.documentElement;
      const requestFS = docEl.requestFullscreen || docEl.webkitRequestFullscreen || docEl.mozRequestFullScreen || docEl.msRequestFullscreen;
      
      if (requestFS) {
        requestFS.call(docEl).then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(() => {});
      }
    }

    function showNotification(msg) {
      notificationText = msg;
      if (notificationTimer) clearTimeout(notificationTimer);
      notificationTimer = setTimeout(() => { notificationText = ""; }, 2000);
    }

    function resetOrientation() {
      orientationOffset.pitch = rawOrientation.pitch;
      orientationOffset.roll = rawOrientation.roll;
      orientationOffset.yaw = rawOrientation.yaw;
      showNotification("ORIENTATION CALIBRATED");
    }

    function updateMapTile(lat, lon) {
      const zoom = 15;
      const latRad = lat * Math.PI / 180;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lon + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      const tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;

      if (tileUrl !== currentTileUrl) {
        currentTileUrl = tileUrl;
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => { mapImage = img; mapImageLoaded = true; };
        img.src = tileUrl;
      }
    }

    async function initAI() {
      await tf.setBackend('webgl');
      await tf.ready();
      cocoModel = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      handModel = await handpose.load();
      requestAnimationFrame(aiDetectionLoop);
    }

    let lastAITime = 0;
    let aiToggle = false;

    async function aiDetectionLoop(timestamp) {
      if (timestamp - lastAITime > 400) {
        if (video.readyState === 4 && video.videoWidth > 0) {
          aiCtx.drawImage(video, 0, 0, 192, 192);

          try {
            if (aiToggle && cocoModel) {
              predictions = await cocoModel.detect(aiCanvas, 3, 0.4);
            } else if (!aiToggle && handModel) {
              handPredictions = await handModel.estimateHands(aiCanvas);
              if (hasValidVideo) processHandGestures(handPredictions);
            }
          } catch(e) {}

          aiToggle = !aiToggle;
          lastAITime = timestamp;
        }
      }
      requestAnimationFrame(aiDetectionLoop);
    }

    function processHandGestures(hands) {
      if (hands.length === 0) return;

      const landmarks = hands[0].landmarks;
      const thumbTip = landmarks[4];
      const indexTip = landmarks[8];
      const wrist = landmarks[0];

      const pinchDist = Math.hypot(thumbTip[0] - indexTip[0], thumbTip[1] - indexTip[1]);

      const normX = (wrist[0] / 192 - 0.5) * 300;
      const normY = (wrist[1] / 192 - 0.5) * 200;
      
      mediaBoxState.x = normX;
      mediaBoxState.y = normY;
      updateYouTubeDOM3D();

      if (gestureCooldown || pinchDist >= 12) return;

      gestureCooldown = true;
      try {
        if (ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
          const state = ytPlayer.getPlayerState();
          if (state === YT.PlayerState.PLAYING) {
            ytPlayer.pauseVideo();
            showNotification("MEDIA: PAUSED");
          } else {
            ytPlayer.playVideo();
            showNotification("MEDIA: PLAYING");
          }
        }
      } catch(e) {}
      setTimeout(() => { gestureCooldown = false; }, 1500);
    }

    function updateYouTubeDOM3D() {
      if (!hasValidVideo) return;
      const transformStyle = `translate(${mediaBoxState.x}px, ${mediaBoxState.y}px) scale(${mediaBoxState.scale})`;
      if (targetYouTubeEye === 'left') {
        ytWrapperLeft.style.transform = transformStyle;
      } else {
        ytWrapperRight.style.transform = transformStyle;
      }
    }

    function initSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          pos => {
            telemetry.lat = pos.coords.latitude;
            telemetry.lon = pos.coords.longitude;
            telemetry.alt = pos.coords.altitude ? pos.coords.altitude.toFixed(1) : '124.5';
            telemetry.speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : '0.0';
            updateMapTile(telemetry.lat, telemetry.lon);
          },
          () => {},
          { enableHighAccuracy: true }
        );
      }
      updateMapTile(telemetry.lat, telemetry.lon);
    }

    function handleOrientation(e) {
      rawOrientation.pitch = e.beta || 0;
      rawOrientation.roll = e.gamma || 0;
      rawOrientation.yaw = e.alpha || 0;

      telemetry.pitch = (rawOrientation.pitch - orientationOffset.pitch).toFixed(1);
      telemetry.roll = (rawOrientation.roll - orientationOffset.roll).toFixed(1);
      telemetry.yaw = ((rawOrientation.yaw - orientationOffset.yaw + 360) % 360).toFixed(1);
    }

    async function populateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');
        camSelect.innerHTML = '';
        videoInputs.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          let label = device.label || `Camera Input ${index + 1}`;
          if (label.toLowerCase().includes('wide') || label.toLowerCase().includes('0') || index === 2) {
            label += ' (Ultra Wide / 0.6x)';
          }
          opt.text = label;
          camSelect.appendChild(opt);
        });
      } catch (err) {}
    }

    async function startCamera(deviceId = null) {
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());

      const videoConstraints = { width: { ideal: 1280 }, height: { ideal: 720 } };
      if (deviceId) videoConstraints.deviceId = { exact: deviceId };
      else videoConstraints.facingMode = { ideal: 'environment' };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = currentStream;
        currentTrack = currentStream.getVideoTracks()[0];
        isUserFacing = currentTrack.label.toLowerCase().includes('front') || currentTrack.label.toLowerCase().includes('user');

        await populateCameras();
        if (deviceId) camSelect.value = deviceId;
        await applyZoom(targetZoom);

        video.onloadedmetadata = () => { video.play(); resizeCanvases(); };
      } catch (err) { alert('Camera Access Denied: ' + err.message); }
    }

    async function applyZoom(zoomVal) {
      targetZoom = zoomVal;
      if (!currentTrack || typeof currentTrack.getCapabilities !== 'function') return;
      const caps = currentTrack.getCapabilities();
      if (caps.zoom) {
        try {
          const clamped = Math.max(caps.zoom.min, Math.min(caps.zoom.max, zoomVal));
          await currentTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
        } catch (e) {}
      }
    }

    function resizeCanvases() {
      const dpr = window.devicePixelRatio || 1;
      const cssWidth = window.innerWidth / 2;
      const cssHeight = window.innerHeight;

      [leftCanvas, rightCanvas].forEach(c => {
        c.width = Math.floor(cssWidth * dpr);
        c.height = Math.floor(cssHeight * dpr);
        const ctx = c.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.scale(dpr, dpr);
      });
    }

    function getParallax(depthLevel, eye) { return (eye === 'left' ? 1 : -1) * depthLevel * 2.5; }

    function drawHUD(ctx, width, height, eye) {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, width * (window.devicePixelRatio || 1), height * (window.devicePixelRatio || 1));
      
      const dpr = window.devicePixelRatio || 1;
      ctx.scale(dpr, dpr);

      const vRatio = video.videoWidth / video.videoHeight || 16/9;
      const cRatio = width / height;
      let renderW = width, renderH = height, xOffset = 0, yOffset = 0;
      if (cRatio > vRatio) {
        renderH = width / vRatio; yOffset = (height - renderH) / 2;
      } else {
        renderW = height * vRatio; xOffset = (width - renderW) / 2;
      }

      ctx.save();
      const shiftX = (eye === 'left' ? 1 : -1) * (userIPD / 2);
      ctx.translate(shiftX, 0);
      
      // Independent FOV Scale + Independent HUD Size Scale separation
      ctx.translate(width / 2, height / 2);
      ctx.scale(userFOV, userFOV);
      ctx.translate(-width / 2, -height / 2);

      ctx.save();
      if (isUserFacing) { ctx.translate(width, 0); ctx.scale(-1, 1); }
      ctx.drawImage(video, xOffset, yOffset, renderW, renderH);
      ctx.restore();

      // Apply independent HUD scale factor to all vector elements
      ctx.translate(width / 2, height / 2);
      ctx.scale(userHUDScale, userHUDScale);
      ctx.translate(-width / 2, -height / 2);

      const primaryColor = '#00f0ff';
      const secondaryColor = '#ff3300';
      const cx = width / 2;
      const cy = height / 2;

      ctx.shadowBlur = 6;
      ctx.shadowColor = primaryColor;
      ctx.strokeStyle = primaryColor;
      ctx.fillStyle = primaryColor;

      const aiScaleX = renderW / 192;
      const aiScaleY = renderH / 192;
      
      const pBbox = getParallax(1.2, eye);
      ctx.save();
      ctx.translate(pBbox, 0);
      
      predictions.forEach(pred => {
        let [x, y, w, h] = pred.bbox;
        x = x * aiScaleX + xOffset; y = y * aiScaleY + yOffset;
        w = w * aiScaleX; h = h * aiScaleY;
        ctx.strokeStyle = secondaryColor; ctx.shadowColor = secondaryColor; ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = secondaryColor; ctx.font = '8px Courier New';
        ctx.fillText(`${pred.class.toUpperCase()} [${Math.round(pred.score * 100)}%]`, x, y - 3);
      });

      handPredictions.forEach(hand => {
        ctx.fillStyle = primaryColor;
        hand.landmarks.forEach(pt => {
          const hx = pt[0] * aiScaleX + xOffset;
          const hy = pt[1] * aiScaleY + yOffset;
          ctx.beginPath(); ctx.arc(hx, hy, 2, 0, Math.PI * 2); ctx.fill();
        });
      });
      ctx.restore();

      ctx.shadowColor = primaryColor;
      const pPanels = getParallax(2.0, eye);
      ctx.save();
      ctx.translate(pPanels, 0);

      ctx.save();
      ctx.transform(1, 0, -0.08, 1, 0, 0);
      ctx.fillStyle = primaryColor; ctx.font = '8px Courier New';
      const leftX = cx - 85;
      ctx.fillText(`SYS: ONLINE`, leftX, cy - 35);
      ctx.fillText(`ALT: ${telemetry.alt}m`, leftX, cy - 23);
      ctx.fillText(`SPD: ${telemetry.speed}km/h`, leftX, cy - 11);
      const batteryLabel = batteryLevel === null
        ? 'BATT: --'
        : `BATT: ${batteryLevel}%${batteryCharging ? ' CHG' : ''}`;
      const batteryColor = batteryCharging
        ? '#7dff7d'
        : batteryLevel !== null && batteryLevel <= 20 ? secondaryColor : primaryColor;
      ctx.fillStyle = batteryColor;
      ctx.fillText(batteryLabel, leftX, cy + 1);
      ctx.strokeStyle = batteryColor;
      ctx.lineWidth = 1;
      ctx.strokeRect(leftX + 42, cy - 6, 20, 8);
      ctx.fillRect(leftX + 63, cy - 4, 2, 4);
      if (batteryLevel !== null) {
        ctx.fillRect(leftX + 44, cy - 4, 16 * batteryLevel / 100, 4);
      }
      ctx.fillStyle = primaryColor;
      ctx.fillText(`TIME: ${currentTimeText}`, leftX, cy + 13);
      ctx.restore();

      ctx.save();
      ctx.transform(1, 0, 0.08, 1, 0, 0);
      const rightX = cx + 25;
      ctx.fillText(`HDG: ${telemetry.yaw}°`, rightX, cy - 35);
      ctx.fillText(`FPS: 60`, rightX, cy - 23);
      ctx.restore();
      ctx.restore();

      const pMap = getParallax(2.5, eye);
      const mapRadius = 26;
      const mapX = cx + 50 + pMap;
      const mapY = cy + 22;

      ctx.save();
      ctx.beginPath(); ctx.arc(mapX, mapY, mapRadius, 0, Math.PI * 2); ctx.clip();
      if (mapImageLoaded) {
        ctx.drawImage(mapImage, mapX - mapRadius, mapY - mapRadius, mapRadius * 2, mapRadius * 2);
      } else {
        ctx.fillStyle = '#001520'; ctx.fillRect(mapX - mapRadius, mapY - mapRadius, mapRadius * 2, mapRadius * 2);
      }
      ctx.restore();

      ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(mapX, mapY, mapRadius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = secondaryColor; ctx.beginPath(); ctx.arc(mapX, mapY, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = primaryColor; ctx.font = '7px Courier New'; ctx.fillText('SAT-NAV', mapX - 14, mapY + mapRadius + 8);

      const pReticle = getParallax(3.2, eye);
      ctx.save();
      ctx.translate(pReticle, 0);
      ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, 2, 0, Math.PI * 2); ctx.fill();

      const pitchOffset = telemetry.pitch * 1.2;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate((-telemetry.roll * Math.PI) / 180);
      ctx.beginPath();
      ctx.moveTo(-40, pitchOffset); ctx.lineTo(-20, pitchOffset);
      ctx.moveTo(20, pitchOffset); ctx.lineTo(40, pitchOffset);
      ctx.stroke();
      ctx.font = '8px Courier New'; ctx.fillText(`P: ${telemetry.pitch}°`, 24, pitchOffset - 4);
      ctx.restore();

      if (notificationText) {
        ctx.fillStyle = secondaryColor; ctx.shadowColor = secondaryColor; ctx.font = 'bold 8px Courier New';
        ctx.fillText(notificationText, cx - (ctx.measureText(notificationText).width / 2), cy - 50);
      }
      
      ctx.restore();
    }

    function renderLoop() {
      const cssW = window.innerWidth / 2;
      const cssH = window.innerHeight;
      if (cssW > 0 && cssH > 0) {
        drawHUD(leftCtx, cssW, cssH, 'left');
        drawHUD(rightCtx, cssW, cssH, 'right');
      }
      requestAnimationFrame(renderLoop);
    }

    camSelect.addEventListener('change', (e) => {
      if (e.target.value) startCamera(e.target.value);
    });

    lensBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        lensBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        applyZoom(parseFloat(e.target.dataset.zoom));
      });
    });

    startBtn.addEventListener('click', () => {
      goFullscreenAndLock();
      
      let val = ytInput.value.trim();
      if (val.includes('youtu.be/')) {
        val = val.split('youtu.be/')[1].split('?')[0];
      } else if (val.includes('watch?v=')) {
        val = val.split('watch?v=')[1].split('&')[0];
      }

      startOverlay.style.display = 'none';
      
      if (val) {
        initYouTubePlayer(val);
        updateYouTubeDOM3D();
      } else {
        hasValidVideo = false;
        ytLayerLeft.style.display = 'none';
        ytLayerRight.style.display = 'none';
      }

      initSensors();
      startCamera(camSelect.value || null);
      initAI();
      requestAnimationFrame(renderLoop);
    });

    window.addEventListener('dblclick', resetOrientation);

    navigator.mediaDevices?.getUserMedia({ video: true }).then(stream => {
      stream.getTracks().forEach(t => t.stop()); populateCameras();
    }).catch(() => {});

    window.addEventListener('resize', () => { setTimeout(resizeCanvases, 250); });
    window.addEventListener('orientationchange', () => { setTimeout(resizeCanvases, 300); });
    document.addEventListener('fullscreenchange', () => { setTimeout(resizeCanvases, 250); });
  </script>
</body>
</html>
