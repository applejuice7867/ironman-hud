<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>JARVIS VR HUD - Fullscreen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      background-color: #000;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* Ensures content fills full display including notch areas */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: rgba(0, 5, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      padding: 20px;
    }
    .btn {
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn:active {
      background: #00f0ff;
      color: #000;
    }
    #vr-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .viewport {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      border-right: 1px solid rgba(0, 240, 255, 0.2);
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #fff;
      font-size: 0.85rem;
      width: 100%;
      max-width: 320px;
    }
    select {
      background: #000;
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 6px 10px;
      border-radius: 4px;
      width: 100%;
      font-family: monospace;
    }
    .lens-toggle {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }
    .lens-btn {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 4px;
      cursor: pointer;
    }
    .lens-btn.active {
      background: #00f0ff;
      color: #000;
      font-weight: bold;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

  <div id="start-overlay">
    <h1 style="color:#00f0ff; text-shadow: 0 0 10px #00f0ff; font-size: 1.6rem;">MARK-LXXXV HUD</h1>
    <p style="color:#aaa; text-align:center; font-size:0.85rem;">Select camera/lens, then press button to enter Fullscreen VR mode.</p>

    <div class="control-group">
      <label for="cam-select">Available Camera Hardware:</label>
      <select id="cam-select">
        <option value="">Granting permissions...</option>
      </select>
    </div>

    <div class="control-group">
      <label>Lens / Zoom Level:</label>
      <div class="lens-toggle">
        <button class="lens-btn active" data-zoom="0.6">0.6x Wide</button>
        <button class="lens-btn" data-zoom="1.0">1.0x Main</button>
        <button class="lens-btn" data-zoom="2.0">2.0x Tele</button>
      </div>
    </div>

    <button class="btn" id="start-btn">ENGAGE FULLSCREEN HUD</button>
  </div>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="vr-container">
    <div class="viewport"><canvas id="leftCanvas"></canvas></div>
    <div class="viewport"><canvas id="rightCanvas"></canvas></div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const leftCanvas = document.getElementById('leftCanvas');
    const rightCanvas = document.getElementById('rightCanvas');
    const leftCtx = leftCanvas.getContext('2d');
    const rightCtx = rightCanvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const camSelect = document.getElementById('cam-select');
    const lensBtns = document.querySelectorAll('.lens-btn');

    let model = null;
    let predictions = [];
    let telemetry = { pitch: 0, roll: 0, yaw: 0, lat: 34.0259, lon: -118.7798, alt: 124.5, speed: 0.0 };
    let currentStream = null;
    let currentTrack = null;
    let targetZoom = 0.6;
    let isUserFacing = false;

    let mapImage = new Image();
    let mapImageLoaded = false;
    let currentTileUrl = '';

    // Trigger Mobile Fullscreen & Lock Orientation
    async function enableFullscreenMode() {
      const docEl = document.documentElement;

      try {
        if (docEl.requestFullscreen) {
          await docEl.requestFullscreen();
        } else if (docEl.webkitRequestFullscreen) {
          await docEl.webkitRequestFullscreen();
        } else if (docEl.msRequestFullscreen) {
          await docEl.msRequestFullscreen();
        }
      } catch (e) {
        console.warn('Fullscreen request bypassed/failed:', e);
      }

      // Lock screen orientation into landscape mode for VR Cardboard
      if (screen.orientation && screen.orientation.lock) {
        try {
          await screen.orientation.lock('landscape');
        } catch (e) {
          console.warn('Orientation lock unsupported/bypassed:', e);
        }
      }
    }

    function updateMapTile(lat, lon) {
      const zoom = 15;
      const latRad = lat * Math.PI / 180;
      const n = Math.pow(2, zoom);
      const xtile = Math.floor((lon + 180) / 360 * n);
      const ytile = Math.floor((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n);
      const tileUrl = `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${zoom}/${ytile}/${xtile}`;

      if (tileUrl !== currentTileUrl) {
        currentTileUrl = tileUrl;
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = () => {
          mapImage = img;
          mapImageLoaded = true;
        };
        img.src = tileUrl;
      }
    }

    async function initObjectDetection() {
      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      detectObjects();
    }

    async function detectObjects() {
      if (model && video.readyState === 4) {
        predictions = await model.detect(video, 6, 0.4);
      }
      setTimeout(detectObjects, 150);
    }

    function initSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          pos => {
            telemetry.lat = pos.coords.latitude;
            telemetry.lon = pos.coords.longitude;
            telemetry.alt = pos.coords.altitude ? pos.coords.altitude.toFixed(1) : '124.5';
            telemetry.speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : '0.0';
            updateMapTile(telemetry.lat, telemetry.lon);
          },
          err => console.log(err),
          { enableHighAccuracy: true }
        );
      }
      updateMapTile(telemetry.lat, telemetry.lon);
    }

    function handleOrientation(e) {
      telemetry.pitch = e.beta ? e.beta.toFixed(1) : 0;
      telemetry.roll = e.gamma ? e.gamma.toFixed(1) : 0;
      telemetry.yaw = e.alpha ? e.alpha.toFixed(1) : 0;
    }

    async function populateCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoInputs = devices.filter(d => d.kind === 'videoinput');

        camSelect.innerHTML = '';
        videoInputs.forEach((device, index) => {
          const opt = document.createElement('option');
          opt.value = device.deviceId;
          
          let label = device.label || `Camera Input ${index + 1}`;
          if (label.toLowerCase().includes('wide') || label.toLowerCase().includes('0') || index === 2) {
            label += ' (Ultra Wide / 0.6x)';
          }
          opt.text = label;
          camSelect.appendChild(opt);
        });
      } catch (err) {
        console.warn('Unable to enumerate cameras:', err);
      }
    }

    async function startCamera(deviceId = null) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const videoConstraints = {
        width: { ideal: 1280 },
        height: { ideal: 720 }
      };

      if (deviceId) {
        videoConstraints.deviceId = { exact: deviceId };
      } else {
        videoConstraints.facingMode = { ideal: 'environment' };
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
        video.srcObject = currentStream;
        currentTrack = currentStream.getVideoTracks()[0];

        const label = currentTrack.label.toLowerCase();
        isUserFacing = label.includes('front') || label.includes('user');

        await populateCameras();
        if (deviceId) camSelect.value = deviceId;

        await applyZoom(targetZoom);

        video.onloadedmetadata = () => {
          video.play();
          resizeCanvases();
        };
      } catch (err) {
        alert('Camera Access Denied or Hardware Unavailable: ' + err.message);
      }
    }

    async function applyZoom(zoomVal) {
      targetZoom = zoomVal;
      if (!currentTrack || typeof currentTrack.getCapabilities !== 'function') return;

      const caps = currentTrack.getCapabilities();
      if (caps.zoom) {
        try {
          const clamped = Math.max(caps.zoom.min, Math.min(caps.zoom.max, zoomVal));
          await currentTrack.applyConstraints({ advanced: [{ zoom: clamped }] });
        } catch (e) {
          console.warn('Zoom constraint unsupported:', e);
        }
      }
    }

    function resizeCanvases() {
      const width = window.innerWidth / 2;
      const height = window.innerHeight;
      [leftCanvas, rightCanvas].forEach(c => {
        c.width = width;
        c.height = height;
      });
    }

    function drawHUD(ctx, width, height) {
      ctx.clearRect(0, 0, width, height);

      // 1. Render Video Background
      const vRatio = video.videoWidth / video.videoHeight || 16/9;
      const cRatio = width / height;
      let renderW = width, renderH = height, xOffset = 0, yOffset = 0;
      if (cRatio > vRatio) {
        renderH = width / vRatio;
        yOffset = (height - renderH) / 2;
      } else {
        renderW = height * vRatio;
        xOffset = (width - renderW) / 2;
      }

      ctx.save();
      if (isUserFacing) {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, xOffset, yOffset, renderW, renderH);
      ctx.restore();

      const primaryColor = '#00f0ff';
      const secondaryColor = '#ff3300';
      const cx = width / 2;
      const cy = height / 2;

      ctx.strokeStyle = primaryColor;
      ctx.fillStyle = primaryColor;
      ctx.lineWidth = 1;

      // 2. Reticle & Pitch Horizon
      ctx.beginPath();
      ctx.arc(cx, cy, 18, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fill();

      const pitchOffset = telemetry.pitch * 1.2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((-telemetry.roll * Math.PI) / 180);

      ctx.beginPath();
      ctx.moveTo(-40, pitchOffset);
      ctx.lineTo(-20, pitchOffset);
      ctx.moveTo(20, pitchOffset);
      ctx.lineTo(40, pitchOffset);
      ctx.stroke();

      ctx.font = '8px Courier New';
      ctx.fillText(`P: ${telemetry.pitch}°`, 24, pitchOffset - 4);
      ctx.restore();

      // 3. Bounding Boxes
      const scaleX = renderW / (video.videoWidth || 1);
      const scaleY = renderH / (video.videoHeight || 1);

      predictions.forEach(pred => {
        let [x, y, w, h] = pred.bbox;
        x = x * scaleX + xOffset;
        y = y * scaleY + yOffset;
        w = w * scaleX;
        h = h * scaleY;

        ctx.strokeStyle = secondaryColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        const len = 5;
        ctx.strokeStyle = primaryColor;
        ctx.beginPath();
        ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
        ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
        ctx.stroke();

        ctx.fillStyle = secondaryColor;
        ctx.font = '8px Courier New';
        const label = `${pred.class.toUpperCase()} [${Math.round(pred.score * 100)}%]`;
        ctx.fillText(label, x, y - 3);
      });

      // 4. Centered Telemetry
      ctx.fillStyle = primaryColor;
      ctx.font = '8px Courier New';

      const leftX = cx - 85;
      ctx.fillText(`SYS: ONLINE`, leftX, cy - 35);
      ctx.fillText(`ALT: ${telemetry.alt}m`, leftX, cy - 23);
      ctx.fillText(`SPD: ${telemetry.speed}km/h`, leftX, cy - 11);
      ctx.fillText(`LENS: ${targetZoom}X`, leftX, cy + 1);

      const rightX = cx + 25;
      ctx.fillText(`HDG: ${telemetry.yaw}°`, rightX, cy - 35);
      ctx.fillText(`FPS: 60`, rightX, cy - 23);

      // 5. Satellite Map (Bottom Right)
      const mapRadius = 26;
      const mapX = cx + 50;
      const mapY = cy + 22;

      ctx.save();
      ctx.beginPath();
      ctx.arc(mapX, mapY, mapRadius, 0, Math.PI * 2);
      ctx.clip();

      if (mapImageLoaded) {
        ctx.drawImage(mapImage, mapX - mapRadius, mapY - mapRadius, mapRadius * 2, mapRadius * 2);
      } else {
        ctx.fillStyle = '#001520';
        ctx.fillRect(mapX - mapRadius, mapY - mapRadius, mapRadius * 2, mapRadius * 2);
      }
      ctx.restore();

      ctx.strokeStyle = primaryColor;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(mapX, mapY, mapRadius, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(mapX - mapRadius, mapY); ctx.lineTo(mapX + mapRadius, mapY);
      ctx.moveTo(mapX, mapY - mapRadius); ctx.lineTo(mapX, mapY + mapRadius);
      ctx.stroke();

      ctx.fillStyle = secondaryColor;
      ctx.beginPath();
      ctx.arc(mapX, mapY, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = primaryColor;
      ctx.font = '7px Courier New';
      ctx.fillText('SAT-NAV', mapX - 14, mapY + mapRadius + 8);

      // Outer Inner Ring
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(width, height) * 0.18, -Math.PI / 4, Math.PI / 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(width, height) * 0.18, (3 * Math.PI) / 4, (5 * Math.PI) / 4);
      ctx.stroke();
    }

    function renderLoop() {
      drawHUD(leftCtx, leftCanvas.width, leftCanvas.height);
      drawHUD(rightCtx, rightCanvas.width, rightCanvas.height);
      requestAnimationFrame(renderLoop);
    }

    camSelect.addEventListener('change', (e) => {
      if (e.target.value) startCamera(e.target.value);
    });

    lensBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        lensBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const zoomVal = parseFloat(e.target.dataset.zoom);
        applyZoom(zoomVal);
      });
    });

    startBtn.addEventListener('click', async () => {
      // Direct user interaction event allows triggering Fullscreen & Orientation API
      await enableFullscreenMode();
      startOverlay.style.display = 'none';
      initSensors();
      await startCamera(camSelect.value || null);
      initObjectDetection();
      requestAnimationFrame(renderLoop);
    });

    navigator.mediaDevices?.getUserMedia({ video: true })
      .then(stream => {
        stream.getTracks().forEach(t => t.stop());
        populateCameras();
      })
      .catch(() => {});

    window.addEventListener('resize', resizeCanvases);
    // Listen for orientation/fullscreen changes to resize canvas viewports dynamically
    document.addEventListener('fullscreenchange', resizeCanvases);
    window.addEventListener('orientationchange', resizeCanvases);
  </script>
</body>
</html>
