<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>JARVIS VR HUD - Compact</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #000;
      color: #00f0ff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #start-overlay {
      position: absolute;
      inset: 0;
      z-index: 999;
      background: rgba(0, 5, 15, 0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }
    .btn {
      background: rgba(0, 240, 255, 0.1);
      border: 2px solid #00f0ff;
      color: #00f0ff;
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .btn:active {
      background: #00f0ff;
      color: #000;
    }
    #vr-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    .viewport {
      position: relative;
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      border-right: 1px solid rgba(0, 240, 255, 0.2);
    }
    video {
      display: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-select {
      margin-top: 10px;
      color: #fff;
      font-size: 0.9rem;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

  <div id="start-overlay">
    <h1 style="color:#00f0ff; text-shadow: 0 0 10px #00f0ff;">MARK-LXXXV HUD</h1>
    <p style="color:#aaa; text-align:center; max-width: 80%;">Place phone into Google Cardboard after engaging system.</p>
    <button class="btn" id="start-btn">ENGAGE HUD SYSTEM</button>
    
    <div class="camera-select">
      <label for="cam-select">Camera Source: </label>
      <select id="cam-select" style="background:#000; color:#00f0ff; border:1px solid #00f0ff; padding:5px;">
        <option value="environment">Rear Camera (World Passthrough)</option>
        <option value="user">Front Camera (User Facing)</option>
      </select>
    </div>
  </div>

  <video id="webcam" autoplay playsinline muted></video>

  <div id="vr-container">
    <div class="viewport"><canvas id="leftCanvas"></canvas></div>
    <div class="viewport"><canvas id="rightCanvas"></canvas></div>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const leftCanvas = document.getElementById('leftCanvas');
    const rightCanvas = document.getElementById('rightCanvas');
    const leftCtx = leftCanvas.getContext('2d');
    const rightCtx = rightCanvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const startOverlay = document.getElementById('start-overlay');
    const camSelect = document.getElementById('cam-select');

    let model = null;
    let predictions = [];
    let telemetry = { pitch: 0, roll: 0, yaw: 0, lat: 0, lon: 0, alt: 0, speed: 0 };

    async function initObjectDetection() {
      model = await cocoSsd.load({ base: 'lite_mobilenet_v2' });
      detectObjects();
    }

    async function detectObjects() {
      if (model && video.readyState === 4) {
        predictions = await model.detect(video, 6, 0.4);
      }
      setTimeout(detectObjects, 150);
    }

    function initSensors() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
        });
      } else {
        window.addEventListener('deviceorientation', handleOrientation);
      }

      if ('geolocation' in navigator) {
        navigator.geolocation.watchPosition(
          pos => {
            telemetry.lat = pos.coords.latitude.toFixed(4);
            telemetry.lon = pos.coords.longitude.toFixed(4);
            telemetry.alt = pos.coords.altitude ? pos.coords.altitude.toFixed(1) : '124.5';
            telemetry.speed = pos.coords.speed ? (pos.coords.speed * 3.6).toFixed(1) : '0.0';
          },
          err => console.log(err),
          { enableHighAccuracy: true }
        );
      }
    }

    function handleOrientation(e) {
      telemetry.pitch = e.beta ? e.beta.toFixed(1) : 0;
      telemetry.roll = e.gamma ? e.gamma.toFixed(1) : 0;
      telemetry.yaw = e.alpha ? e.alpha.toFixed(1) : 0;
    }

    async function startCamera() {
      const facingMode = camSelect.value;
      const constraints = {
        video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      };

      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          resizeCanvases();
          requestAnimationFrame(renderLoop);
        };
      } catch (err) {
        alert('Camera Access Denied or Unavailable: ' + err.message);
      }
    }

    function resizeCanvases() {
      const width = window.innerWidth / 2;
      const height = window.innerHeight;
      [leftCanvas, rightCanvas].forEach(c => {
        c.width = width;
        c.height = height;
      });
    }

    function drawHUD(ctx, width, height) {
      ctx.clearRect(0, 0, width, height);

      // 1. Render Video Background
      const vRatio = video.videoWidth / video.videoHeight;
      const cRatio = width / height;
      let renderW = width, renderH = height, xOffset = 0, yOffset = 0;
      if (cRatio > vRatio) {
        renderH = width / vRatio;
        yOffset = (height - renderH) / 2;
      } else {
        renderW = height * vRatio;
        xOffset = (width - renderW) / 2;
      }

      ctx.save();
      if (camSelect.value === 'user') {
        ctx.translate(width, 0);
        ctx.scale(-1, 1);
      }
      ctx.drawImage(video, xOffset, yOffset, renderW, renderH);
      ctx.restore();

      const primaryColor = '#00f0ff';
      const secondaryColor = '#ff3300';
      const cx = width / 2;
      const cy = height / 2;

      ctx.strokeStyle = primaryColor;
      ctx.fillStyle = primaryColor;
      ctx.lineWidth = 1; // Thinner lines

      // 2. Scaled-Down Reticle & Artificial Horizon
      ctx.beginPath();
      ctx.arc(cx, cy, 22, 0, Math.PI * 2); // Reticle radius reduced from 40 to 22
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Pitch Horizon Line (Narrower width & smaller text offset)
      const pitchOffset = telemetry.pitch * 1.5;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((-telemetry.roll * Math.PI) / 180);

      ctx.beginPath();
      ctx.moveTo(-50, pitchOffset);
      ctx.lineTo(-25, pitchOffset);
      ctx.moveTo(25, pitchOffset);
      ctx.lineTo(50, pitchOffset);
      ctx.stroke();

      ctx.font = '9px Courier New';
      ctx.fillText(`PITCH: ${telemetry.pitch}°`, 30, pitchOffset - 5);
      ctx.restore();

      // 3. Object Recognition Bounding Boxes (Thinner lines & smaller font)
      const scaleX = renderW / video.videoWidth;
      const scaleY = renderH / video.videoHeight;

      predictions.forEach(pred => {
        let [x, y, w, h] = pred.bbox;
        x = x * scaleX + xOffset;
        y = y * scaleY + yOffset;
        w = w * scaleX;
        h = h * scaleY;

        ctx.strokeStyle = secondaryColor;
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x, y, w, h);

        const len = 6; // Shorter corner accents
        ctx.strokeStyle = primaryColor;
        ctx.beginPath();
        ctx.moveTo(x, y + len); ctx.lineTo(x, y); ctx.lineTo(x + len, y);
        ctx.moveTo(x + w - len, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + len);
        ctx.stroke();

        ctx.fillStyle = secondaryColor;
        ctx.font = '9px Courier New';
        const label = `${pred.class.toUpperCase()} [${Math.round(pred.score * 100)}%]`;
        ctx.fillText(label, x, y - 4);
      });

      // 4. Compact Telemetry Sidebars
      ctx.fillStyle = primaryColor;
      ctx.font = '9px Courier New';

      // Left Telemetry Block
      ctx.fillText(`SYS: ONLINE`, 15, 25);
      ctx.fillText(`LAT: ${telemetry.lat}`, 15, 38);
      ctx.fillText(`LON: ${telemetry.lon}`, 15, 51);
      ctx.fillText(`ALT: ${telemetry.alt}m`, 15, 64);

      // Right Telemetry Block
      ctx.fillText(`HDG: ${telemetry.yaw}°`, width - 95, 25);
      ctx.fillText(`SPD: ${telemetry.speed}km/h`, width - 95, 38);
      ctx.fillText(`FPS: 60`, width - 95, 51);

      // Outer Decorative Arc (Radius reduced from 0.42 to 0.28)
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(width, height) * 0.28, -Math.PI / 4, Math.PI / 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, Math.min(width, height) * 0.28, (3 * Math.PI) / 4, (5 * Math.PI) / 4);
      ctx.stroke();
    }

    function renderLoop() {
      drawHUD(leftCtx, leftCanvas.width, leftCanvas.height);
      drawHUD(rightCtx, rightCanvas.width, rightCanvas.height);
      requestAnimationFrame(renderLoop);
    }

    startBtn.addEventListener('click', () => {
      startOverlay.style.display = 'none';
      initSensors();
      startCamera();
      initObjectDetection();
    });

    window.addEventListener('resize', resizeCanvases);
  </script>
</body>
</html>
